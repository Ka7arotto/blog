<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">多模态信号如何进入大语言模型</title>
  <desc id="desc">文本、图像、语音和视频通过各自的切分与编码方式变成向量，经投影和位置编码后组成统一的多模态 token 序列，再由语言模型进行跨模态推理并生成答案或动作。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eff6f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 46px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .card-title { font: 700 24px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; text-anchor: middle; }
      .card-sub { font: 400 16px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; text-anchor: middle; }
      .step-title { font: 700 22px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; text-anchor: middle; }
      .step-sub { font: 400 15px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; text-anchor: middle; }
      .white-title { font: 700 27px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #fff; text-anchor: middle; }
      .white-sub { font: 400 16px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #dbeafe; text-anchor: middle; }
      .flow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .join { stroke: #64748b; stroke-width: 3; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="68" class="title" text-anchor="middle">Multimodal Token Flow</text>
  <text x="800" y="106" class="subtitle" text-anchor="middle">不同原始信号先被编码和对齐，LLM 最终看到的是带有位置与模态信息的向量序列</text>

  <g filter="url(#shadow)">
    <rect x="70" y="165" width="300" height="135" rx="22" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="120" cy="215" r="27" fill="#dbeafe"/>
    <text x="120" y="224" font-size="28" text-anchor="middle">T</text>
    <text x="220" y="215" class="card-title">文本</text>
    <text x="220" y="255" class="card-sub">字符 · 单词 · 代码 · 标记</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="455" y="165" width="300" height="135" rx="22" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="487" y="188" width="58" height="50" rx="9" fill="#ede9fe"/>
    <circle cx="508" cy="205" r="7" fill="#7c3aed"/>
    <path d="M493 230 L510 214 L523 225 L539 207 V232 H493 Z" fill="#c4b5fd"/>
    <text x="605" y="215" class="card-title">图像 / 文档</text>
    <text x="605" y="255" class="card-sub">像素 · 版面 · 表格 · UI</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="840" y="165" width="300" height="135" rx="22" fill="#fff" stroke="#d97706" stroke-width="2"/>
    <path d="M880 225 C890 190 900 250 910 207 C920 180 930 252 940 215 C950 192 960 238 970 213" stroke="#d97706" stroke-width="4" fill="none"/>
    <text x="990" y="215" class="card-title">语音 / 音频</text>
    <text x="990" y="255" class="card-sub">波形 · 频谱 · 时间片段</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1225" y="165" width="300" height="135" rx="22" fill="#fff" stroke="#0f766e" stroke-width="2"/>
    <rect x="1258" y="190" width="78" height="52" rx="8" fill="#ccfbf1"/>
    <path d="M1288 202 L1288 230 L1312 216 Z" fill="#0f766e"/>
    <text x="1375" y="215" class="card-title">视频</text>
    <text x="1375" y="255" class="card-sub">帧 · Clip · 音轨 · 事件</text>
  </g>

  <path class="flow" d="M220 300 V355"/>
  <path class="flow" d="M605 300 V355"/>
  <path class="flow" d="M990 300 V355"/>
  <path class="flow" d="M1375 300 V355"/>

  <g filter="url(#shadow)">
    <rect x="90" y="365" width="260" height="125" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="220" y="415" class="step-title">Tokenizer</text>
    <text x="220" y="453" class="step-sub">Text Tokens</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="475" y="365" width="260" height="125" rx="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="605" y="415" class="step-title">Vision Encoder</text>
    <text x="605" y="453" class="step-sub">Patches → Visual Features</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="860" y="365" width="260" height="125" rx="20" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="990" y="415" class="step-title">Audio Encoder</text>
    <text x="990" y="453" class="step-sub">Audio Features</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1245" y="365" width="260" height="125" rx="20" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="1375" y="415" class="step-title">Video Encoder</text>
    <text x="1375" y="453" class="step-sub">Frames / Clips → Features</text>
  </g>

  <path class="join" d="M220 490 V540 H1375 V490"/>
  <path class="join" d="M605 490 V540"/>
  <path class="join" d="M990 490 V540"/>
  <path class="flow" d="M800 540 V585"/>

  <g filter="url(#shadow)">
    <rect x="300" y="595" width="1000" height="105" rx="24" fill="#fff" stroke="#0891b2" stroke-width="3"/>
    <text x="800" y="635" class="card-title">Modality Alignment + Position / Layout / Time Encoding</text>
    <text x="800" y="674" class="card-sub">非文本特征经 Projector / Adapter 映射，并保留空间位置、文档布局和时间顺序</text>
  </g>

  <path class="flow" d="M800 700 V735"/>

  <g filter="url(#shadow)">
    <rect x="210" y="750" width="760" height="105" rx="22" fill="#0f172a"/>
    <text x="590" y="790" class="white-title">Unified Multimodal Context</text>
    <text x="590" y="827" class="white-sub">[Text] [Image] [Audio] [Video] → LLM / Multimodal Transformer</text>
  </g>
  <path class="flow" d="M970 802 H1040"/>
  <g filter="url(#shadow)">
    <rect x="1050" y="750" width="340" height="105" rx="22" fill="#0f766e"/>
    <text x="1220" y="790" class="white-title">理解与输出</text>
    <text x="1220" y="827" class="white-sub">答案 · 语音 · 图像 · 动作</text>
  </g>
</svg>
