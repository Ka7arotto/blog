<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">预训练如何形成能力及其边界</title>
  <desc id="desc">上下文经过下一个 token 预测和交叉熵优化，将可预测结构压缩进参数，形成语言、知识、代码和推理能力，同时数据分布不等于事实真理。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 46px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 22px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .heading { font: 700 27px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .body { font: 400 19px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .token { font: 600 20px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .token-light { font: 600 20px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
      .cap { font: 600 21px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; text-anchor: middle; }
      .arrow { stroke: #334155; stroke-width: 4; fill: none; marker-end: url(#arrow2); }
      .small { font: 500 17px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg2)"/>
  <text x="800" y="75" class="title" text-anchor="middle">From Prediction to General Capabilities</text>
  <text x="800" y="113" class="subtitle" text-anchor="middle">统一预测目标如何形成可迁移结构，以及它无法独自解决什么</text>

  <path class="arrow" d="M390 330 H470"/>
  <path class="arrow" d="M790 330 H870"/>
  <path class="arrow" d="M1190 330 H1260"/>
  <path class="arrow" d="M1030 460 V590"/>

  <g filter="url(#shadow2)">
    <rect x="70" y="190" width="320" height="280" rx="24" fill="#fff" stroke="#0f766e" stroke-width="3"/>
    <rect x="70" y="190" width="320" height="14" rx="7" fill="#0f766e"/>
    <text x="230" y="250" class="heading" text-anchor="middle">上下文与真实 token</text>
    <g>
      <rect x="100" y="294" width="68" height="54" rx="12" fill="#ccfbf1"/><text x="134" y="322" class="token">牛顿</text>
      <rect x="178" y="294" width="68" height="54" rx="12" fill="#ccfbf1"/><text x="212" y="322" class="token">提出</text>
      <rect x="256" y="294" width="96" height="54" rx="12" fill="#ccfbf1"/><text x="304" y="322" class="token">万有引力</text>
      <rect x="151" y="380" width="158" height="58" rx="14" fill="#0f766e"/>
      <text x="230" y="410" class="token-light">目标：定律</text>
    </g>
  </g>

  <g filter="url(#shadow2)">
    <rect x="470" y="190" width="320" height="280" rx="24" fill="#fff" stroke="#d97706" stroke-width="3"/>
    <rect x="470" y="190" width="320" height="14" rx="7" fill="#d97706"/>
    <text x="630" y="250" class="heading" text-anchor="middle">预测分布与 Loss</text>
    <rect x="510" y="292" width="180" height="23" rx="11" fill="#fde68a"/>
    <rect x="510" y="332" width="105" height="23" rx="11" fill="#fed7aa"/>
    <rect x="510" y="372" width="55" height="23" rx="11" fill="#e2e8f0"/>
    <text x="710" y="310" class="body">定律 0.71</text>
    <text x="635" y="350" class="body">理论 0.13</text>
    <text x="585" y="390" class="body">其他</text>
    <text x="630" y="435" class="small">交叉熵推动真实 token 概率上升</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="870" y="190" width="320" height="280" rx="24" fill="#fff" stroke="#4f46e5" stroke-width="3"/>
    <rect x="870" y="190" width="320" height="14" rx="7" fill="#4f46e5"/>
    <text x="1030" y="250" class="heading" text-anchor="middle">结构压缩进参数</text>
    <ellipse cx="1030" cy="340" rx="116" ry="70" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="1030" y="330" class="heading" text-anchor="middle">Pθ</text>
    <text x="1030" y="370" class="small">可预测 · 可复用 · 可组合</text>
    <text x="1030" y="435" class="small">语料规模远大于参数规模</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="1260" y="190" width="270" height="280" rx="24" fill="#fff" stroke="#0284c7" stroke-width="3"/>
    <rect x="1260" y="190" width="270" height="14" rx="7" fill="#0284c7"/>
    <text x="1395" y="250" class="heading" text-anchor="middle">通用能力</text>
    <rect x="1292" y="286" width="112" height="58" rx="14" fill="#e0f2fe"/><text x="1348" y="321" class="cap">语言</text>
    <rect x="1416" y="286" width="82" height="58" rx="14" fill="#dcfce7"/><text x="1457" y="321" class="cap">知识</text>
    <rect x="1292" y="360" width="112" height="58" rx="14" fill="#ffedd5"/><text x="1348" y="395" class="cap">代码</text>
    <rect x="1416" y="360" width="82" height="58" rx="14" fill="#f3e8ff"/><text x="1457" y="395" class="cap">推理</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="585" y="610" width="890" height="178" rx="24" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <circle cx="645" cy="667" r="27" fill="#ea580c"/>
    <text x="645" y="676" font-family="Inter, sans-serif" font-size="31" font-weight="700" fill="#fff" text-anchor="middle">!</text>
    <text x="695" y="674" class="heading" fill="#9a3412">能力边界：数据分布不等于事实真理</text>
    <text x="630" y="730" class="body">预训练擅长学习“什么文本更可能出现”，但事实可靠、价值对齐、实时知识和工具执行仍需外部机制。</text>
    <text x="1030" y="766" class="small" fill="#c2410c">Post-training · RAG · Tools · External Verification</text>
  </g>

  <text x="800" y="850" class="small">预测下一个 token → 最小化 Loss → 逼近数据分布 → 压缩可泛化结构</text>
</svg>
