<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent 的系统组成与执行闭环</title>
  <desc id="desc">用户目标进入 Agent 后，在控制器和安全边界约束下依次经过规划、行动、观察和复盘。工具连接外部环境，状态系统保存任务进度，满足验收条件后交付结果。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef7f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <style>
      .title { font: 700 46px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .section { font: 600 18px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .node-title { font: 700 25px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; text-anchor: middle; }
      .node-sub { font: 400 16px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; text-anchor: middle; }
      .small-title { font: 700 21px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; text-anchor: middle; }
      .small-sub { font: 400 15px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; text-anchor: middle; }
      .white-title { font: 700 25px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #fff; text-anchor: middle; }
      .white-sub { font: 400 16px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ccfbf1; text-anchor: middle; }
      .flow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #0f766e; stroke-width: 4; fill: none; marker-end: url(#loop-arrow); }
      .support { stroke: #64748b; stroke-width: 3; stroke-dasharray: 9 7; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="68" class="title" text-anchor="middle">Agent Execution Loop</text>
  <text x="800" y="106" class="subtitle" text-anchor="middle">模型负责决策，系统负责执行、记录、验证与约束</text>

  <rect x="45" y="140" width="1510" height="650" rx="30" fill="#ffffff" fill-opacity=".68" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="75" y="178" class="section">Controller + Guardrails：权限 · 预算 · 轮数 · 确认 · 终止 · 审计</text>

  <g filter="url(#shadow)">
    <rect x="70" y="280" width="230" height="150" rx="24" fill="#0f766e"/>
    <text x="185" y="340" class="white-title">用户目标</text>
    <text x="185" y="378" class="white-sub">约束 · 资源 · 验收标准</text>
    <text x="185" y="405" class="white-sub">不是一次性问题</text>
  </g>

  <path class="flow" d="M300 355 H375"/>

  <g filter="url(#shadow)">
    <rect x="385" y="265" width="245" height="180" rx="24" fill="#fff" stroke="#2563eb" stroke-width="3"/>
    <circle cx="425" cy="305" r="22" fill="#2563eb"/>
    <text x="425" y="312" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="508" y="340" class="node-title">Plan</text>
    <text x="508" y="380" class="node-sub">理解目标 · 拆解任务</text>
    <text x="508" y="409" class="node-sub">决定下一步</text>
  </g>

  <path class="loop" d="M630 355 H700"/>

  <g filter="url(#shadow)">
    <rect x="710" y="265" width="245" height="180" rx="24" fill="#fff" stroke="#d97706" stroke-width="3"/>
    <circle cx="750" cy="305" r="22" fill="#d97706"/>
    <text x="750" y="312" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="833" y="340" class="node-title">Act</text>
    <text x="833" y="380" class="node-sub">选择工具 · 生成参数</text>
    <text x="833" y="409" class="node-sub">系统校验后执行</text>
  </g>

  <path class="loop" d="M955 355 H1025"/>

  <g filter="url(#shadow)">
    <rect x="1035" y="265" width="245" height="180" rx="24" fill="#fff" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="1075" cy="305" r="22" fill="#7c3aed"/>
    <text x="1075" y="312" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="1158" y="340" class="node-title">Observe</text>
    <text x="1158" y="380" class="node-sub">接收数据 · 日志 · 错误</text>
    <text x="1158" y="409" class="node-sub">记录环境变化</text>
  </g>

  <path class="loop" d="M1280 355 H1350"/>

  <g filter="url(#shadow)">
    <rect x="1360" y="265" width="170" height="180" rx="24" fill="#fff" stroke="#0f766e" stroke-width="3"/>
    <circle cx="1400" cy="305" r="22" fill="#0f766e"/>
    <text x="1400" y="312" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="1445" y="340" class="node-title">Reflect</text>
    <text x="1445" y="380" class="node-sub">验证 · 修正</text>
    <text x="1445" y="409" class="node-sub">继续或终止</text>
  </g>

  <path class="loop" d="M1445 455 V510 H508 V455"/>
  <text x="985" y="500" class="small-sub">未满足验收条件：更新状态并进入下一轮</text>

  <g filter="url(#shadow)">
    <rect x="700" y="570" width="265" height="125" rx="22" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="833" y="620" class="small-title">Tools</text>
    <text x="833" y="655" class="small-sub">搜索 · API · 终端 · 浏览器</text>
  </g>
  <path class="support" d="M833 445 V570"/>

  <g filter="url(#shadow)">
    <rect x="1015" y="570" width="265" height="125" rx="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="1148" y="620" class="small-title">Environment</text>
    <text x="1148" y="655" class="small-sub">文件 · 数据库 · 业务系统</text>
  </g>
  <path class="support" d="M1148 445 V570"/>
  <path class="flow" d="M965 632 H1005"/>

  <g filter="url(#shadow)">
    <rect x="385" y="570" width="265" height="125" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="518" y="620" class="small-title">Memory / State</text>
    <text x="518" y="655" class="small-sub">计划 · 进度 · 观察 · 执行轨迹</text>
  </g>
  <path class="support" d="M518 445 V570"/>

  <path class="flow" d="M1530 355 H1560 V735 H1335"/>
  <g filter="url(#shadow)">
    <rect x="1015" y="720" width="320" height="105" rx="22" fill="#0f766e"/>
    <text x="1175" y="765" class="white-title">交付结果</text>
    <text x="1175" y="798" class="white-sub">结果 · 证据 · 变更 · 审计记录</text>
  </g>
  <text x="1420" y="712" class="small-sub">满足验收条件</text>

  <rect x="180" y="842" width="1240" height="42" rx="14" fill="#ccfbf1"/>
  <text x="800" y="870" class="small-title">Agent 的目标：不是多走几步，而是让每一步可执行、可记录、可验证、可约束</text>
</svg>
