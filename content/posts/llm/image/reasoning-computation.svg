<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">普通回答与推理模型的计算过程</title>
  <desc id="desc">对比普通模型从问题直接生成答案，与推理模型经过分解、推导、验证和修正后输出答案的过程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <style>
      .title { font: 700 46px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 21px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .lane-title { font: 700 28px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .card-title { font: 700 23px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; text-anchor: middle; }
      .card-sub { font: 400 17px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; text-anchor: middle; }
      .answer { font: 700 23px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #fff; text-anchor: middle; }
      .metric { font: 600 19px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .gray-flow { stroke: #64748b; stroke-width: 4; fill: none; marker-end: url(#arrow-gray); }
      .green-flow { stroke: #0f766e; stroke-width: 4; fill: none; marker-end: url(#arrow-green); }
      .loop { stroke: #0f766e; stroke-width: 4; stroke-dasharray: 10 8; fill: none; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="72" class="title" text-anchor="middle">Direct Answer vs Reasoning</text>
  <text x="800" y="110" class="subtitle" text-anchor="middle">底层都在逐 token 生成，区别在于是否展开、检查和修正计算过程</text>

  <g filter="url(#shadow)">
    <rect x="70" y="155" width="1460" height="250" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <rect x="70" y="155" width="18" height="250" rx="9" fill="#64748b"/>
  <text x="125" y="210" class="lane-title">普通回答</text>
  <text x="125" y="244" class="subtitle">快速生成最终文本</text>

  <g filter="url(#shadow)">
    <rect x="310" y="230" width="250" height="105" rx="19" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="435" y="276" class="card-title">问题</text>
    <text x="435" y="308" class="card-sub">约束与目标</text>
  </g>
  <path class="gray-flow" d="M560 282 H915"/>
  <text x="737" y="263" class="metric" text-anchor="middle">直接生成</text>
  <g filter="url(#shadow)">
    <rect x="925" y="230" width="300" height="105" rx="19" fill="#475569"/>
    <text x="1075" y="292" class="answer">最终答案</text>
  </g>
  <text x="1280" y="270" class="metric">延迟较低</text>
  <text x="1280" y="305" class="metric">错误难以发现</text>

  <g filter="url(#shadow)">
    <rect x="70" y="455" width="1460" height="345" rx="26" fill="#fff" stroke="#99f6e4" stroke-width="2"/>
  </g>
  <rect x="70" y="455" width="18" height="345" rx="9" fill="#0f766e"/>
  <text x="125" y="510" class="lane-title">推理模型</text>
  <text x="125" y="544" class="subtitle">用更多中间 token 和验证步骤提高复杂任务可靠性</text>

  <g filter="url(#shadow)">
    <rect x="150" y="610" width="190" height="105" rx="19" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="245" y="656" class="card-title">问题</text>
    <text x="245" y="688" class="card-sub">读取约束</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="405" y="610" width="190" height="105" rx="19" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="500" y="656" class="card-title">分解</text>
    <text x="500" y="688" class="card-sub">拆成子问题</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="660" y="610" width="190" height="105" rx="19" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="755" y="656" class="card-title">推导</text>
    <text x="755" y="688" class="card-sub">生成中间状态</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="915" y="610" width="190" height="105" rx="19" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="1010" y="656" class="card-title">验证</text>
    <text x="1010" y="688" class="card-sub">测试与约束检查</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1170" y="610" width="260" height="105" rx="19" fill="#0f766e"/>
    <text x="1300" y="671" class="answer">最终答案</text>
  </g>

  <path class="green-flow" d="M340 662 H395"/>
  <path class="green-flow" d="M595 662 H650"/>
  <path class="green-flow" d="M850 662 H905"/>
  <path class="green-flow" d="M1105 662 H1160"/>
  <path class="loop" d="M1010 725 V760 H755 V725"/>
  <text x="880" y="782" class="metric" text-anchor="middle">失败时回退并修正</text>

  <rect x="180" y="835" width="1240" height="42" rx="14" fill="#ccfbf1"/>
  <text x="800" y="863" class="metric" text-anchor="middle">更多计算并非目标本身：关键是让计算可检查、可修正、可停止</text>
</svg>
