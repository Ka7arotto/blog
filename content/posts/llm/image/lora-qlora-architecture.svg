<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">LoRA and QLoRA architecture</title>
  <desc id="desc">LoRA freezes the base weight and trains two low-rank matrices. QLoRA stores the frozen base weight in 4-bit precision and trains the LoRA branch in BF16.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f2f8f6"/>
    </linearGradient>
    <linearGradient id="trainable" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb35c"/>
      <stop offset="1" stop-color="#f2834b"/>
    </linearGradient>
    <linearGradient id="trainableTwo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55c8b0"/>
      <stop offset="1" stop-color="#159b8b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#31506f" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1450" cy="100" r="190" fill="#d8f4ed" opacity="0.5"/>
  <circle cx="120" cy="830" r="210" fill="#e1eafe" opacity="0.65"/>

  <text x="110" y="92" fill="#172b4d" font-family="Inter, 'PingFang SC', sans-serif" font-size="45" font-weight="700">LoRA：冻结基础权重，只训练低秩增量</text>
  <text x="110" y="137" fill="#60708a" font-family="Inter, 'PingFang SC', sans-serif" font-size="24">同一输入经过基础分支与 LoRA 分支，两路结果相加得到最终输出</text>

  <rect x="105" y="190" width="1390" height="400" rx="30" fill="#ffffff" filter="url(#shadow)"/>

  <rect x="145" y="325" width="120" height="90" rx="20" fill="#172b4d"/>
  <text x="205" y="381" text-anchor="middle" fill="#ffffff" font-family="Inter, 'PingFang SC', sans-serif" font-size="31" font-weight="700">x</text>

  <path d="M265 370 H350" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M305 370 V270 H420" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="440" y="220" width="260" height="105" rx="22" fill="#e9eff8" stroke="#8aa0bd" stroke-width="3"/>
  <text x="570" y="264" text-anchor="middle" fill="#243b5a" font-family="Inter, 'PingFang SC', sans-serif" font-size="26" font-weight="700">基础权重 W₀</text>
  <text x="570" y="298" text-anchor="middle" fill="#60708a" font-family="Inter, 'PingFang SC', sans-serif" font-size="20">d_out × d_in · Frozen</text>

  <path d="M700 272 H1185 V350" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="400" y="402" width="220" height="112" rx="22" fill="url(#trainable)"/>
  <text x="510" y="448" text-anchor="middle" fill="#ffffff" font-family="Inter, 'PingFang SC', sans-serif" font-size="27" font-weight="700">矩阵 A</text>
  <text x="510" y="482" text-anchor="middle" fill="#fffaf4" font-family="Inter, 'PingFang SC', sans-serif" font-size="20">d_in → rank r</text>

  <path d="M620 458 H705" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="725" y="402" width="220" height="112" rx="22" fill="url(#trainableTwo)"/>
  <text x="835" y="448" text-anchor="middle" fill="#ffffff" font-family="Inter, 'PingFang SC', sans-serif" font-size="27" font-weight="700">矩阵 B</text>
  <text x="835" y="482" text-anchor="middle" fill="#f3fffc" font-family="Inter, 'PingFang SC', sans-serif" font-size="20">rank r → d_out</text>

  <path d="M945 458 H1015" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="1035" y="418" width="118" height="80" rx="18" fill="#fff5e8" stroke="#e99b49" stroke-width="3"/>
  <text x="1094" y="469" text-anchor="middle" fill="#a3541f" font-family="Inter, 'PingFang SC', sans-serif" font-size="26" font-weight="700">α / r</text>
  <path d="M1153 458 H1185 V405" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>

  <circle cx="1185" cy="375" r="30" fill="#ffffff" stroke="#526985" stroke-width="4"/>
  <text x="1185" y="386" text-anchor="middle" fill="#243b5a" font-family="Inter, sans-serif" font-size="34" font-weight="700">+</text>
  <path d="M1215 375 H1305" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="1325" y="330" width="125" height="90" rx="20" fill="#172b4d"/>
  <text x="1387" y="386" text-anchor="middle" fill="#ffffff" font-family="Inter, 'PingFang SC', sans-serif" font-size="31" font-weight="700">h</text>

  <rect x="425" y="536" width="190" height="32" rx="16" fill="#fff0dc"/>
  <circle cx="448" cy="552" r="7" fill="#ef8a48"/>
  <text x="465" y="559" fill="#9b5429" font-family="Inter, 'PingFang SC', sans-serif" font-size="18" font-weight="600">Trainable</text>
  <rect x="625" y="536" width="190" height="32" rx="16" fill="#e7edf5"/>
  <circle cx="648" cy="552" r="7" fill="#8092aa"/>
  <text x="665" y="559" fill="#526985" font-family="Inter, 'PingFang SC', sans-serif" font-size="18" font-weight="600">Frozen</text>

  <text x="110" y="676" fill="#172b4d" font-family="Inter, 'PingFang SC', sans-serif" font-size="34" font-weight="700">QLoRA 的变化：基础权重以 4-bit 保存</text>
  <text x="110" y="716" fill="#60708a" font-family="Inter, 'PingFang SC', sans-serif" font-size="22">计算时按需反量化，LoRA 分支仍以较高精度训练</text>

  <rect x="110" y="755" width="330" height="92" rx="22" fill="#e9eff8" stroke="#8aa0bd" stroke-width="3"/>
  <text x="275" y="793" text-anchor="middle" fill="#243b5a" font-family="Inter, 'PingFang SC', sans-serif" font-size="23" font-weight="700">4-bit 基础权重 Wq</text>
  <text x="275" y="824" text-anchor="middle" fill="#60708a" font-family="Inter, 'PingFang SC', sans-serif" font-size="18">Frozen · 不保存梯度</text>
  <path d="M440 801 H535" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="555" y="755" width="250" height="92" rx="22" fill="#ffffff" stroke="#8aa0bd" stroke-width="3"/>
  <text x="680" y="793" text-anchor="middle" fill="#243b5a" font-family="Inter, 'PingFang SC', sans-serif" font-size="23" font-weight="700">反量化后计算</text>
  <text x="680" y="824" text-anchor="middle" fill="#60708a" font-family="Inter, 'PingFang SC', sans-serif" font-size="18">Compute dtype: BF16 / FP16</text>
  <path d="M805 801 H900" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="920" y="755" width="300" height="92" rx="22" fill="url(#trainable)"/>
  <text x="1070" y="793" text-anchor="middle" fill="#ffffff" font-family="Inter, 'PingFang SC', sans-serif" font-size="23" font-weight="700">LoRA A / B</text>
  <text x="1070" y="824" text-anchor="middle" fill="#fffaf4" font-family="Inter, 'PingFang SC', sans-serif" font-size="18">BF16 / FP16 · Trainable</text>
  <path d="M1220 801 H1315" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="1335" y="755" width="155" height="92" rx="22" fill="#e4f7f1" stroke="#39a992" stroke-width="3"/>
  <text x="1412" y="793" text-anchor="middle" fill="#157c6d" font-family="Inter, 'PingFang SC', sans-serif" font-size="22" font-weight="700">仅更新</text>
  <text x="1412" y="824" text-anchor="middle" fill="#157c6d" font-family="Inter, 'PingFang SC', sans-serif" font-size="18">低秩参数</text>
</svg>
