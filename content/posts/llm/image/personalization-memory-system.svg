<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">个性化助手的记忆系统</title>
  <desc id="desc">展示个性化助手在回答前同步检索记忆，并在交互后异步提取、校验和写入记忆的完整流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#059669"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 38px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .lane { font: 700 24px Inter, ui-sans-serif, system-ui, sans-serif; }
      .box-title { font: 700 22px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .box-text { font: 500 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .small { font: 600 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .badge { font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; }
      .arrow-label { font: 600 15px Inter, ui-sans-serif, system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="940" rx="28" fill="url(#bg)"/>
  <text x="80" y="78" class="title">个性化助手：读取记忆与写入记忆</text>
  <text x="80" y="116" class="subtitle">模型近似无状态；连续性由模型外部的 Memory Service 提供</text>

  <rect x="70" y="155" width="1460" height="292" rx="24" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="70" y="155" width="190" height="48" rx="24" fill="#dcfce7"/>
  <text x="102" y="187" class="lane" fill="#047857">同步读取链路</text>

  <rect x="105" y="245" width="220" height="122" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="145" y="287" class="box-title">当前请求</text>
  <text x="145" y="321" class="box-text">用户 + 任务 + 会话</text>

  <path d="M325 306H397" stroke="#059669" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="340" y="286" class="arrow-label" fill="#047857">识别范围</text>

  <rect x="410" y="230" width="250" height="152" rx="18" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <text x="452" y="276" class="box-title">权限过滤</text>
  <text x="452" y="311" class="box-text">Tenant / User / ACL</text>
  <text x="452" y="340" class="box-text">先隔离，再检索</text>

  <path d="M660 306H732" stroke="#059669" stroke-width="4" marker-end="url(#arrow-green)"/>

  <rect x="745" y="216" width="280" height="180" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="797" y="262" class="box-title">记忆检索与排序</text>
  <text x="797" y="299" class="box-text">语义 · 关键词 · 时间</text>
  <text x="797" y="328" class="box-text">重要性 · 置信度 · 来源</text>
  <rect x="797" y="350" width="176" height="28" rx="14" fill="#d1fae5"/>
  <text x="821" y="369" class="small">只返回相关 Top-K</text>

  <path d="M1025 306H1097" stroke="#059669" stroke-width="4" marker-end="url(#arrow-green)"/>

  <rect x="1110" y="230" width="210" height="152" rx="18" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="2"/>
  <text x="1152" y="276" class="box-title">组装上下文</text>
  <text x="1152" y="311" class="box-text">规则 + 相关记忆</text>
  <text x="1152" y="340" class="box-text">+ 当前请求</text>

  <path d="M1320 306H1372" stroke="#059669" stroke-width="4" marker-end="url(#arrow-green)"/>

  <rect x="1385" y="245" width="110" height="122" rx="18" fill="#059669"/>
  <text x="1408" y="300" class="box-title" fill="#ffffff">LLM</text>
  <text x="1403" y="330" class="badge" fill="#d1fae5">个性化输出</text>

  <rect x="70" y="483" width="1460" height="382" rx="24" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#shadow)"/>
  <rect x="70" y="483" width="190" height="48" rx="24" fill="#dbeafe"/>
  <text x="102" y="515" class="lane" fill="#1d4ed8">异步写入链路</text>

  <rect x="105" y="590" width="220" height="122" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="145" y="632" class="box-title">交互事件</text>
  <text x="145" y="666" class="box-text">对话 · 工具结果 · 反馈</text>

  <path d="M325 651H397" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <rect x="410" y="574" width="250" height="154" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="449" y="618" class="box-title">候选记忆提取</text>
  <text x="449" y="653" class="box-text">原子化与分类</text>
  <text x="449" y="682" class="box-text">记录来源与时间</text>

  <path d="M660 651H732" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <rect x="745" y="552" width="280" height="198" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="804" y="598" class="box-title">Memory Write Gate</text>
  <text x="790" y="636" class="box-text">去重 · 冲突 · 敏感信息</text>
  <text x="790" y="665" class="box-text">稳定性 · 价值 · 授权策略</text>
  <rect x="790" y="690" width="190" height="34" rx="17" fill="#dbeafe"/>
  <text x="817" y="713" class="small">决定是否值得记住</text>

  <path d="M1025 651H1097" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <rect x="1110" y="545" width="385" height="212" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="1152" y="588" class="box-title">Memory Service</text>
  <rect x="1152" y="613" width="142" height="40" rx="12" fill="#fef3c7"/>
  <text x="1180" y="639" class="small">Primary Store</text>
  <rect x="1311" y="613" width="142" height="40" rx="12" fill="#ede9fe"/>
  <text x="1334" y="639" class="small">Retrieval Index</text>
  <rect x="1152" y="670" width="142" height="40" rx="12" fill="#fee2e2"/>
  <text x="1187" y="696" class="small">版本 / TTL</text>
  <rect x="1311" y="670" width="142" height="40" rx="12" fill="#cffafe"/>
  <text x="1344" y="696" class="small">缓存 / 审计</text>
  <text x="1152" y="739" class="box-text">正文是事实来源；索引可重建</text>

  <path d="M1302 545V431H886V396" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#arrow-green)"/>
  <text x="1082" y="422" class="arrow-label" fill="#475569">下一次请求时被检索</text>

  <rect x="105" y="792" width="920" height="42" rx="14" fill="#f1f5f9"/>
  <circle cx="132" cy="813" r="8" fill="#22c55e"/>
  <text x="151" y="819" class="small">明确声明优先于隐式推断</text>
  <circle cx="405" cy="813" r="8" fill="#3b82f6"/>
  <text x="424" y="819" class="small">记忆是低权限参考数据</text>
  <circle cx="691" cy="813" r="8" fill="#f59e0b"/>
  <text x="710" y="819" class="small">支持更新、遗忘与彻底删除</text>

  <text x="80" y="908" class="subtitle">关键原则：只保存有长期价值且经过授权的信息，只检索当前任务真正需要的记忆。</text>
</svg>
