<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">大模型训练的六类并行策略</title>
  <desc id="desc">数据并行、张量并行、流水线并行、状态分片、专家并行与序列并行分别拆分训练过程中的不同对象。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 46px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 21px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .card-title { font: 700 27px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .card-sub { font: 400 18px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .small { font: 700 16px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; text-anchor: middle; dominant-baseline: middle; }
      .tiny { font: 700 14px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
      .footer { font: 600 21px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f766e; text-anchor: middle; }
      .line { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="70" class="title" text-anchor="middle">分布式训练的并行策略</text>
  <text x="800" y="108" class="subtitle" text-anchor="middle">先判断“拆什么”，再理解每种并行策略</text>

  <g filter="url(#shadow)">
    <rect x="55" y="155" width="470" height="270" rx="24" fill="#fff" stroke="#0f766e" stroke-width="3"/>
    <rect x="55" y="155" width="470" height="14" rx="7" fill="#0f766e"/>
    <text x="87" y="213" class="card-title">数据并行 · DP</text>
    <text x="87" y="246" class="card-sub">拆训练批次：模型完整复制，样本分片</text>
    <g>
      <rect x="88" y="285" width="82" height="82" rx="13" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
      <rect x="195" y="285" width="82" height="82" rx="13" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
      <rect x="302" y="285" width="82" height="82" rx="13" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
      <rect x="409" y="285" width="82" height="82" rx="13" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
      <text x="129" y="315" class="small">模型</text><text x="129" y="344" class="small">数据1</text>
      <text x="236" y="315" class="small">模型</text><text x="236" y="344" class="small">数据2</text>
      <text x="343" y="315" class="small">模型</text><text x="343" y="344" class="small">数据3</text>
      <text x="450" y="315" class="small">模型</text><text x="450" y="344" class="small">数据4</text>
    </g>
    <text x="290" y="399" class="card-sub" text-anchor="middle">代价：梯度 AllReduce</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="565" y="155" width="470" height="270" rx="24" fill="#fff" stroke="#4f46e5" stroke-width="3"/>
    <rect x="565" y="155" width="470" height="14" rx="7" fill="#4f46e5"/>
    <text x="597" y="213" class="card-title">张量并行 · TP</text>
    <text x="597" y="246" class="card-sub">拆矩阵：多卡共同完成同一层计算</text>
    <rect x="640" y="286" width="320" height="82" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <rect x="640" y="286" width="80" height="82" rx="12" fill="#c7d2fe"/>
    <rect x="720" y="286" width="80" height="82" fill="#a5b4fc"/>
    <rect x="800" y="286" width="80" height="82" fill="#818cf8"/>
    <rect x="880" y="286" width="80" height="82" rx="12" fill="#6366f1"/>
    <text x="680" y="327" class="small">W1</text><text x="760" y="327" class="small">W2</text>
    <text x="840" y="327" class="small">W3</text><text x="920" y="327" class="tiny">W4</text>
    <text x="800" y="399" class="card-sub" text-anchor="middle">代价：层内频繁聚合</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1075" y="155" width="470" height="270" rx="24" fill="#fff" stroke="#d97706" stroke-width="3"/>
    <rect x="1075" y="155" width="470" height="14" rx="7" fill="#d97706"/>
    <text x="1107" y="213" class="card-title">流水线并行 · PP</text>
    <text x="1107" y="246" class="card-sub">拆模型层：不同 Stage 保存不同层</text>
    <rect x="1108" y="295" width="78" height="70" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <rect x="1215" y="295" width="78" height="70" rx="12" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <rect x="1322" y="295" width="78" height="70" rx="12" fill="#fcd34d" stroke="#d97706" stroke-width="2"/>
    <rect x="1429" y="295" width="78" height="70" rx="12" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
    <path class="line" d="M1186 330 H1205"/><path class="line" d="M1293 330 H1312"/><path class="line" d="M1400 330 H1419"/>
    <text x="1147" y="330" class="small">S1</text><text x="1254" y="330" class="small">S2</text>
    <text x="1361" y="330" class="small">S3</text><text x="1468" y="330" class="small">S4</text>
    <text x="1310" y="399" class="card-sub" text-anchor="middle">代价：Pipeline Bubble</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="55" y="470" width="470" height="270" rx="24" fill="#fff" stroke="#0284c7" stroke-width="3"/>
    <rect x="55" y="470" width="470" height="14" rx="7" fill="#0284c7"/>
    <text x="87" y="528" class="card-title">ZeRO / FSDP</text>
    <text x="87" y="561" class="card-sub">拆训练状态：参数、梯度与优化器状态分片</text>
    <g>
      <rect x="89" y="600" width="91" height="76" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      <rect x="197" y="600" width="91" height="76" rx="12" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
      <rect x="305" y="600" width="91" height="76" rx="12" fill="#7dd3fc" stroke="#0284c7" stroke-width="2"/>
      <rect x="413" y="600" width="78" height="76" rx="12" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
      <text x="134" y="638" class="small">分片1</text><text x="242" y="638" class="small">分片2</text>
      <text x="350" y="638" class="small">分片3</text><text x="452" y="638" class="small">分片4</text>
    </g>
    <text x="290" y="713" class="card-sub" text-anchor="middle">代价：AllGather / ReduceScatter</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="565" y="470" width="470" height="270" rx="24" fill="#fff" stroke="#7c3aed" stroke-width="3"/>
    <rect x="565" y="470" width="470" height="14" rx="7" fill="#7c3aed"/>
    <text x="597" y="528" class="card-title">专家并行 · EP</text>
    <text x="597" y="561" class="card-sub">拆 MoE Experts：Token 路由到不同设备</text>
    <circle cx="800" cy="630" r="39" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="800" y="630" class="small">路由器</text>
    <rect x="610" y="601" width="92" height="58" rx="12" fill="#c4b5fd"/><text x="656" y="630" class="small">专家1</text>
    <rect x="898" y="601" width="92" height="58" rx="12" fill="#a78bfa"/><text x="944" y="630" class="small">专家2</text>
    <path class="line" d="M760 630 H712"/><path class="line" d="M840 630 H888"/>
    <text x="800" y="713" class="card-sub" text-anchor="middle">代价：Token AllToAll 与负载不均</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1075" y="470" width="470" height="270" rx="24" fill="#fff" stroke="#65a30d" stroke-width="3"/>
    <rect x="1075" y="470" width="470" height="14" rx="7" fill="#65a30d"/>
    <text x="1107" y="528" class="card-title">序列 / 上下文并行 · SP/CP</text>
    <text x="1107" y="561" class="card-sub">拆序列：同一样本的 Token 分布到多卡</text>
    <g>
      <rect x="1110" y="605" width="93" height="62" rx="10" fill="#d9f99d"/><text x="1156" y="636" class="small">T1–T4</text>
      <rect x="1211" y="605" width="93" height="62" rx="10" fill="#bef264"/><text x="1257" y="636" class="small">T5–T8</text>
      <rect x="1312" y="605" width="93" height="62" rx="10" fill="#a3e635"/><text x="1358" y="636" class="small">T9–T12</text>
      <rect x="1413" y="605" width="93" height="62" rx="10" fill="#84cc16"/><text x="1459" y="636" class="small">T13–T16</text>
    </g>
    <text x="1310" y="713" class="card-sub" text-anchor="middle">代价：跨分片交换上下文</text>
  </g>

  <rect x="125" y="792" width="1350" height="65" rx="18" fill="#ccfbf1" stroke="#5eead4" stroke-width="2"/>
  <text x="800" y="834" class="footer">每种策略都用通信换取显存容量、计算规模或训练吞吐</text>
</svg>
