<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">3D Parallel 中数据、张量与流水线并行的组合</title>
  <desc id="desc">每个流水线阶段内使用张量并行切分层内矩阵，完整流水线由多个数据并行副本处理不同批次。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 46px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 21px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .axis { font: 700 22px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; text-anchor: middle; }
      .replica { font: 700 22px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f766e; text-anchor: end; dominant-baseline: middle; }
      .cell-title { font: 700 17px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; text-anchor: middle; }
      .shard { font: 700 14px Inter, sans-serif; fill: white; text-anchor: middle; dominant-baseline: middle; }
      .legend { font: 600 19px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .formula { font: 700 25px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f766e; text-anchor: middle; }
      .flow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dp-link { stroke: #0f766e; stroke-width: 3; stroke-dasharray: 8 8; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="70" class="title" text-anchor="middle">3D Parallel = DP × TP × PP</text>
  <text x="800" y="108" class="subtitle" text-anchor="middle">三个维度分别拆训练批次、层内矩阵和模型层</text>

  <text x="400" y="160" class="axis">流水线阶段 1</text>
  <text x="705" y="160" class="axis">流水线阶段 2</text>
  <text x="1010" y="160" class="axis">流水线阶段 3</text>
  <text x="1315" y="160" class="axis">流水线阶段 4</text>

  <text x="205" y="270" class="replica">DP 副本 1</text>
  <text x="205" y="465" class="replica">DP 副本 2</text>
  <text x="205" y="660" class="replica">DP 副本 3</text>

  <path class="dp-link" d="M235 205 V725"/>

  <g filter="url(#shadow)">
    <rect x="270" y="195" width="260" height="150" rx="20" fill="#fff" stroke="#0f766e" stroke-width="3"/>
    <rect x="285" y="240" width="50" height="58" rx="9" fill="#0f766e"/><text x="310" y="269" class="shard">TP1</text>
    <rect x="345" y="240" width="50" height="58" rx="9" fill="#14b8a6"/><text x="370" y="269" class="shard">TP2</text>
    <rect x="405" y="240" width="50" height="58" rx="9" fill="#2dd4bf"/><text x="430" y="269" class="shard">TP3</text>
    <rect x="465" y="240" width="50" height="58" rx="9" fill="#5eead4"/><text x="490" y="269" class="shard">TP4</text>
    <text x="400" y="324" class="cell-title">模型层组 1</text>
  </g>
  <path class="flow" d="M530 270 H565"/>
  <g filter="url(#shadow)">
    <rect x="575" y="195" width="260" height="150" rx="20" fill="#fff" stroke="#4f46e5" stroke-width="3"/>
    <rect x="590" y="240" width="50" height="58" rx="9" fill="#4f46e5"/><text x="615" y="269" class="shard">TP1</text>
    <rect x="650" y="240" width="50" height="58" rx="9" fill="#6366f1"/><text x="675" y="269" class="shard">TP2</text>
    <rect x="710" y="240" width="50" height="58" rx="9" fill="#818cf8"/><text x="735" y="269" class="shard">TP3</text>
    <rect x="770" y="240" width="50" height="58" rx="9" fill="#a5b4fc"/><text x="795" y="269" class="shard">TP4</text>
    <text x="705" y="324" class="cell-title">模型层组 2</text>
  </g>
  <path class="flow" d="M835 270 H870"/>
  <g filter="url(#shadow)">
    <rect x="880" y="195" width="260" height="150" rx="20" fill="#fff" stroke="#d97706" stroke-width="3"/>
    <rect x="895" y="240" width="50" height="58" rx="9" fill="#d97706"/><text x="920" y="269" class="shard">TP1</text>
    <rect x="955" y="240" width="50" height="58" rx="9" fill="#f59e0b"/><text x="980" y="269" class="shard">TP2</text>
    <rect x="1015" y="240" width="50" height="58" rx="9" fill="#fbbf24"/><text x="1040" y="269" class="shard">TP3</text>
    <rect x="1075" y="240" width="50" height="58" rx="9" fill="#fcd34d"/><text x="1100" y="269" class="shard">TP4</text>
    <text x="1010" y="324" class="cell-title">模型层组 3</text>
  </g>
  <path class="flow" d="M1140 270 H1175"/>
  <g filter="url(#shadow)">
    <rect x="1185" y="195" width="260" height="150" rx="20" fill="#fff" stroke="#dc2626" stroke-width="3"/>
    <rect x="1200" y="240" width="50" height="58" rx="9" fill="#dc2626"/><text x="1225" y="269" class="shard">TP1</text>
    <rect x="1260" y="240" width="50" height="58" rx="9" fill="#ef4444"/><text x="1285" y="269" class="shard">TP2</text>
    <rect x="1320" y="240" width="50" height="58" rx="9" fill="#f87171"/><text x="1345" y="269" class="shard">TP3</text>
    <rect x="1380" y="240" width="50" height="58" rx="9" fill="#fca5a5"/><text x="1405" y="269" class="shard">TP4</text>
    <text x="1315" y="324" class="cell-title">模型层组 4</text>
  </g>

  <g opacity=".87" filter="url(#shadow)">
    <rect x="270" y="390" width="260" height="150" rx="20" fill="#fff" stroke="#0f766e" stroke-width="3"/>
    <rect x="285" y="435" width="50" height="58" rx="9" fill="#0f766e"/><rect x="345" y="435" width="50" height="58" rx="9" fill="#14b8a6"/>
    <rect x="405" y="435" width="50" height="58" rx="9" fill="#2dd4bf"/><rect x="465" y="435" width="50" height="58" rx="9" fill="#5eead4"/>
    <text x="310" y="464" class="shard">TP1</text><text x="370" y="464" class="shard">TP2</text><text x="430" y="464" class="shard">TP3</text><text x="490" y="464" class="shard">TP4</text>
    <text x="400" y="519" class="cell-title">模型层组 1</text>
    <rect x="575" y="390" width="260" height="150" rx="20" fill="#fff" stroke="#4f46e5" stroke-width="3"/>
    <rect x="590" y="435" width="50" height="58" rx="9" fill="#4f46e5"/><rect x="650" y="435" width="50" height="58" rx="9" fill="#6366f1"/>
    <rect x="710" y="435" width="50" height="58" rx="9" fill="#818cf8"/><rect x="770" y="435" width="50" height="58" rx="9" fill="#a5b4fc"/>
    <text x="615" y="464" class="shard">TP1</text><text x="675" y="464" class="shard">TP2</text><text x="735" y="464" class="shard">TP3</text><text x="795" y="464" class="shard">TP4</text>
    <text x="705" y="519" class="cell-title">模型层组 2</text>
    <rect x="880" y="390" width="260" height="150" rx="20" fill="#fff" stroke="#d97706" stroke-width="3"/>
    <rect x="895" y="435" width="50" height="58" rx="9" fill="#d97706"/><rect x="955" y="435" width="50" height="58" rx="9" fill="#f59e0b"/>
    <rect x="1015" y="435" width="50" height="58" rx="9" fill="#fbbf24"/><rect x="1075" y="435" width="50" height="58" rx="9" fill="#fcd34d"/>
    <text x="920" y="464" class="shard">TP1</text><text x="980" y="464" class="shard">TP2</text><text x="1040" y="464" class="shard">TP3</text><text x="1100" y="464" class="shard">TP4</text>
    <text x="1010" y="519" class="cell-title">模型层组 3</text>
    <rect x="1185" y="390" width="260" height="150" rx="20" fill="#fff" stroke="#dc2626" stroke-width="3"/>
    <rect x="1200" y="435" width="50" height="58" rx="9" fill="#dc2626"/><rect x="1260" y="435" width="50" height="58" rx="9" fill="#ef4444"/>
    <rect x="1320" y="435" width="50" height="58" rx="9" fill="#f87171"/><rect x="1380" y="435" width="50" height="58" rx="9" fill="#fca5a5"/>
    <text x="1225" y="464" class="shard">TP1</text><text x="1285" y="464" class="shard">TP2</text><text x="1345" y="464" class="shard">TP3</text><text x="1405" y="464" class="shard">TP4</text>
    <text x="1315" y="519" class="cell-title">模型层组 4</text>
  </g>
  <path class="flow" d="M530 465 H565"/><path class="flow" d="M835 465 H870"/><path class="flow" d="M1140 465 H1175"/>

  <g opacity=".72" filter="url(#shadow)">
    <rect x="270" y="585" width="260" height="150" rx="20" fill="#fff" stroke="#0f766e" stroke-width="3"/>
    <rect x="285" y="630" width="50" height="58" rx="9" fill="#0f766e"/><rect x="345" y="630" width="50" height="58" rx="9" fill="#14b8a6"/>
    <rect x="405" y="630" width="50" height="58" rx="9" fill="#2dd4bf"/><rect x="465" y="630" width="50" height="58" rx="9" fill="#5eead4"/>
    <text x="310" y="659" class="shard">TP1</text><text x="370" y="659" class="shard">TP2</text><text x="430" y="659" class="shard">TP3</text><text x="490" y="659" class="shard">TP4</text>
    <text x="400" y="714" class="cell-title">模型层组 1</text>
    <rect x="575" y="585" width="260" height="150" rx="20" fill="#fff" stroke="#4f46e5" stroke-width="3"/>
    <rect x="590" y="630" width="50" height="58" rx="9" fill="#4f46e5"/><rect x="650" y="630" width="50" height="58" rx="9" fill="#6366f1"/>
    <rect x="710" y="630" width="50" height="58" rx="9" fill="#818cf8"/><rect x="770" y="630" width="50" height="58" rx="9" fill="#a5b4fc"/>
    <text x="615" y="659" class="shard">TP1</text><text x="675" y="659" class="shard">TP2</text><text x="735" y="659" class="shard">TP3</text><text x="795" y="659" class="shard">TP4</text>
    <text x="705" y="714" class="cell-title">模型层组 2</text>
    <rect x="880" y="585" width="260" height="150" rx="20" fill="#fff" stroke="#d97706" stroke-width="3"/>
    <rect x="895" y="630" width="50" height="58" rx="9" fill="#d97706"/><rect x="955" y="630" width="50" height="58" rx="9" fill="#f59e0b"/>
    <rect x="1015" y="630" width="50" height="58" rx="9" fill="#fbbf24"/><rect x="1075" y="630" width="50" height="58" rx="9" fill="#fcd34d"/>
    <text x="920" y="659" class="shard">TP1</text><text x="980" y="659" class="shard">TP2</text><text x="1040" y="659" class="shard">TP3</text><text x="1100" y="659" class="shard">TP4</text>
    <text x="1010" y="714" class="cell-title">模型层组 3</text>
    <rect x="1185" y="585" width="260" height="150" rx="20" fill="#fff" stroke="#dc2626" stroke-width="3"/>
    <rect x="1200" y="630" width="50" height="58" rx="9" fill="#dc2626"/><rect x="1260" y="630" width="50" height="58" rx="9" fill="#ef4444"/>
    <rect x="1320" y="630" width="50" height="58" rx="9" fill="#f87171"/><rect x="1380" y="630" width="50" height="58" rx="9" fill="#fca5a5"/>
    <text x="1225" y="659" class="shard">TP1</text><text x="1285" y="659" class="shard">TP2</text><text x="1345" y="659" class="shard">TP3</text><text x="1405" y="659" class="shard">TP4</text>
    <text x="1315" y="714" class="cell-title">模型层组 4</text>
  </g>
  <path class="flow" d="M530 660 H565"/><path class="flow" d="M835 660 H870"/><path class="flow" d="M1140 660 H1175"/>

  <rect x="130" y="786" width="1340" height="70" rx="18" fill="#ccfbf1" stroke="#5eead4" stroke-width="2"/>
  <text x="800" y="829" class="formula">GPU 总数 = 数据并行 × 流水线并行 × 张量并行</text>
</svg>
